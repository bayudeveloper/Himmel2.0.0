<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="https://files.catbox.moe/rbfc5x.jpg" type="image/jpeg">
    <title id="page">Himmel API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css">
    <style>
/* ── CLOUD SCENE ─────────────────────────────────── */
.cloud-scene {
    position: relative;
    height: 180px;
    margin-bottom: 28px;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(180deg, #0c0c10 0%, #080810 60%, var(--bg) 100%);
    border: 1px solid var(--border);
}

/* Stars */
.cloud-scene::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 15%, rgba(255,255,255,.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 25%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 8%  45%, rgba(255,255,255,.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 50%, rgba(255,255,255,.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 8%, rgba(201,169,110,.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 18%, rgba(201,169,110,.3) 0%, transparent 100%);
    pointer-events: none;
}

/* Clouds shared shape */
.cloud {
    position: absolute;
    background: rgba(255,255,255,.04);
    border-radius: 999px;
    filter: blur(18px);
}
.cloud::before,
.cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: inherit;
}

/* Cloud 1 — slow, large, rear */
.cloud-1 {
    width: 300px; height: 60px;
    top: 55%; left: -320px;
    background: rgba(200,184,160,.045);
    filter: blur(22px);
    animation: drift1 38s linear infinite;
}
.cloud-1::before {
    width: 180px; height: 50px;
    top: -25px; left: 50px;
}
.cloud-1::after {
    width: 120px; height: 40px;
    top: -18px; left: 150px;
}

/* Cloud 2 — medium speed */
.cloud-2 {
    width: 220px; height: 45px;
    top: 35%; left: -240px;
    background: rgba(180,170,155,.05);
    filter: blur(16px);
    animation: drift2 24s linear infinite;
    animation-delay: -10s;
}
.cloud-2::before {
    width: 130px; height: 38px;
    top: -20px; left: 40px;
}
.cloud-2::after {
    width: 80px; height: 30px;
    top: -14px; left: 120px;
}

/* Cloud 3 — fast, small, front */
.cloud-3 {
    width: 160px; height: 36px;
    top: 60%; left: -180px;
    background: rgba(201,169,110,.03);
    filter: blur(12px);
    animation: drift3 17s linear infinite;
    animation-delay: -5s;
}
.cloud-3::before {
    width: 90px; height: 28px;
    top: -14px; left: 30px;
}

/* Cloud 4 */
.cloud-4 {
    width: 260px; height: 52px;
    top: 25%; left: -280px;
    background: rgba(180,175,165,.035);
    filter: blur(20px);
    animation: drift1 44s linear infinite;
    animation-delay: -20s;
}
.cloud-4::before {
    width: 140px; height: 44px;
    top: -22px; left: 60px;
}

@keyframes drift1 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 320px)); } }
@keyframes drift2 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 260px)); } }
@keyframes drift3 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 200px)); } }

/* Scene overlay — bottom fade to page bg */
.cloud-scene-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--bg));
    pointer-events: none;
}

/* Scene label */
.cloud-scene-label {
    position: absolute; bottom: 16px; right: 16px;
    font-family: 'Space Mono', monospace;
    font-size: .6rem; color: rgba(255,255,255,.1);
    letter-spacing: .08em;
    pointer-events: none;
}
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loader-container">
            <div class="gif-frame"><div class="gif-wrapper">
                <img src="https://files.catbox.moe/tbk8kv.gif" alt="" class="loader-gif">
            </div></div>
            <div class="loader-text">
                <span class="tp" style="--i:1">l</span><span class="tp" style="--i:2">o</span><span class="tp" style="--i:3">a</span><span class="tp" style="--i:4">d</span><span class="tp" style="--i:5">i</span><span class="tp" style="--i:6">n</span><span class="tp" style="--i:7">g</span>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="loadingProgressBar"></div></div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-inner">
            <a class="navbar-brand" id="navBrand" href="portofolio.html">
                <div class="brand-logo"><img src="https://files.catbox.moe/rbfc5x.jpg" alt="Himmel"></div>
                <span id="header" class="brand-text"></span>
            </a>
            <div class="nav-actions">
                <div class="api-counter" id="apiCallCounter">
                    <span id="counterVal">0</span>
                    <span style="font-family:'Space Mono',monospace;font-size:.68rem;color:var(--dim)">calls</span>
                </div>
                <a href="/admin.html" class="nav-icon-btn" title="Admin">adm</a>
            </div>
        </div>
    </nav>

    <div class="page-wrap">

        <!-- Cloud Animation Scene (replaces thumbnail) -->
        <div class="cloud-scene">
            <div class="cloud cloud-4"></div>
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
            <div class="cloud-scene-overlay"></div>
            <span class="cloud-scene-label" id="header-scene"></span>
        </div>

        <div class="title-row">
            <h1 id="name" class="page-title"></h1>
            <div id="version" class="version-badge"></div>
        </div>

        <div class="uptime-bar">
            <div class="uptime-dot"></div>
            <span class="uptime-label">Uptime</span>
            <span class="uptime-val" id="valUptime">— hari</span>
        </div>

        <p id="description" class="page-desc"></p>
        <div id="apiLinks" class="api-links"></div>

        <div class="search-wrap">
            <span class="search-icon">/</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari endpoint...">
        </div>

        <div id="apiContent"></div>
    </div>

    <div class="modal fade" id="apiResponseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title" id="apiResponseModalLabel"></h5>
                        <p class="modal-sub mb-0" id="apiResponseModalDesc"></p>
                    </div>
                    <button class="modal-x" data-bs-dismiss="modal">x</button>
                </div>
                <div class="modal-body">
                    <pre id="apiEndpoint" class="code-block"></pre>
                    <div id="apiQueryInputContainer"></div>
                    <div id="apiResponseLoading" class="d-none d-flex justify-content-center align-items-center" style="height:80px">
                        <div class="h-spinner"></div>
                    </div>
                    <pre id="apiResponseContent" class="d-none mt-2 code-block resp-block"></pre>
                </div>
                <div class="modal-footer">
                    <button id="submitQueryBtn" class="btn-himmel">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastMsg"></div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Set cloud scene label to API name when loaded
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var name = document.getElementById('name');
                var label = document.getElementById('header-scene');
                if (name && label) label.textContent = name.textContent.toUpperCase();
            }, 1200);
        });
    </script>
</body>
</html>
